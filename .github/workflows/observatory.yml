name: Daily observatory

on:
  schedule:
    # Fires the night before on purpose. GitHub's `schedule` is best-effort with
    # no SLA, and observed delays have been 2h40m-4h36m (07-24 +4h36m, 07-25
    # +2h40m, 07-26 +3h03m), so a 03:07 cron delivered the digest hours after the
    # intended 06:00 CET. Starting at 23:17 absorbs that delay in most cases.
    # Off both the hour and minute boundary, which are the congested slots.
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      no_slack:
        description: "Skip the Slack digest — for test runs, so the channel does not get a second digest"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  observatory:
    runs-on: ubuntu-latest
    # A hang backstop, not a working constraint: it exists because the first
    # production run hung indefinitely (8f2093a). Sits well above a normal run so
    # the internal TIME_BUDGET_MIN is what actually bounds the work, and leaves a
    # 20-minute margin so the commit step always runs.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r observatory/requirements.txt

      # continue-on-error so a degraded run still reaches the commit step below:
      # the harvest it did manage is already written and worth keeping. The final
      # step turns the job red afterwards.
      - name: Run observatory
        id: observatory
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GATE_MODEL: ${{ vars.GATE_MODEL }}
          GATE_REASONING: ${{ vars.GATE_REASONING }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m observatory.run ${{ inputs.no_slack && '--no-slack' || '' }}

      - name: Commit new records
        run: |
          git config user.name "tas-observatory"
          git config user.email "actions@github.com"
          git add data/innovations.jsonl
          if git diff --cached --quiet; then
            echo "No new records today"
          else
            git commit -m "observatory: daily update $(date -u +%F)"
            git push
          fi

      - name: Fail if the run was degraded
        run: |
          if [ -f .degraded ]; then
            echo "::error::$(cat .degraded)"
            exit 1
          fi
          if [ "${{ steps.observatory.outcome }}" = "failure" ]; then
            echo "::error::observatory step failed"
            exit 1
          fi
          echo "Clean run"
