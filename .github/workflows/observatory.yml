name: Daily observatory

on:
  schedule:
    # Odd minute on purpose: minute-0 crons on GitHub are congested and often
    # delayed or skipped; off-peak times fire much more reliably.
    - cron: "7 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r observatory/requirements.txt

      # continue-on-error so a degraded run still reaches the commit step below:
      # the harvest it did manage is already written and worth keeping. The final
      # step turns the job red afterwards.
      - name: Run observatory
        id: observatory
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m observatory.run

      - name: Commit new records
        run: |
          git config user.name "tas-observatory"
          git config user.email "actions@github.com"
          git add data/innovations.jsonl
          if git diff --cached --quiet; then
            echo "No new records today"
          else
            git commit -m "observatory: daily update $(date -u +%F)"
            git push
          fi

      - name: Fail if the run was degraded
        run: |
          if [ -f .degraded ]; then
            echo "::error::$(cat .degraded)"
            exit 1
          fi
          if [ "${{ steps.observatory.outcome }}" = "failure" ]; then
            echo "::error::observatory step failed"
            exit 1
          fi
          echo "Clean run"
